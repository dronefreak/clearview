name: Quick Check

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  quick-test:
    name: Quick Tests (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyTorch CPU (lightweight)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install minimal dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov numpy pillow

      - name: Install package
        run: |
          pip install -e .

      - name: Run quick tests (unit tests only)
        run: |
          pytest tests/test_models.py tests/test_losses.py tests/test_utils.py -v --tb=short

  lint-check:
    name: Quick Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: |
          pip install ruff black

      - name: Check formatting
        run: |
          black --check clearview tests

      - name: Check linting
        run: |
          ruff check clearview tests
